
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oriel JCR Pool League</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
  <link rel="icon" href="icon.ico">
</head>
<body>
  <main class="container">
    <a href="https://www.orieljcr.org/pool-rankings/" class="return-button">← Return to Oriel JCR</a>
    <header>
      <div class="eyebrow">ORIEL COLLEGE · OXFORD</div>
      <h1>JCR Pool League</h1>
      <p>Official league standings</p>
    </header>

    <section class="leaderboard">
      <div class="table-heading">
        <h2>League Table</h2>
        <span id="status">Loading rankings...</span>
      </div>

      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Player</th>
            <th>Points</th>
          </tr>
        </thead>
        <tbody id="rankings">
          <tr><td colspan="3">Loading...</td></tr>
        </tbody>
      </table>
    </section>

    <footer>
      Oriel College JCR · Pool League
    </footer>
  </main>
</body>
</html>
